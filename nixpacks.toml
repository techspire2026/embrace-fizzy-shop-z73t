[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["corepack enable"]

[variables]
COREPACK_INTEGRITY_KEYS = ""
NODE_ENV = "development"

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter backend build"]

[start]
cmd = "NODE_ENV=production pnpm --filter backend start"
